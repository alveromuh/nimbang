<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="whyTitle whyDesc" width="900" height="620">
  <title id="whyTitle">The Nimbang decision framework from goal to review</title>
  <desc id="whyDesc">Nine stages in three phases: define what you want, compare choices using goals and evidence, then test, reflect, decide, and learn from what happens.</desc>

  <style>
    .bg { fill: #faf9f5; }
    .phase { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; fill: #5f5e56; }
    .phase-sub { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: #5f5e56; }
    .node { fill: #ffffff; stroke: #c9c5b8; stroke-width: 2; }
    .node-accent { fill: #e6efe9; stroke: #2f5d50; stroke-width: 2; }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: #5f5e56; }
    .num-accent { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: #2f5d50; }
    .name { font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 600; fill: #1a1a17; }
    .what { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: #5f5e56; }
    .arrow { stroke: #c9c5b8; stroke-width: 2.5; fill: none; }
    .arrow-head { fill: #c9c5b8; }
    .drop { stroke: #c9c5b8; stroke-width: 2; fill: none; stroke-dasharray: 5 6; }
    .drop-head { fill: #c9c5b8; }
  </style>

  <rect class="bg" width="900" height="620"/>

  <text class="phase" x="40" y="44">1 · Set up the decision</text>
  <text class="phase-sub" x="40" y="68">Name your goal, choices, and what you know.</text>

  <rect class="node" x="40" y="90" width="240" height="88" rx="8"/>
  <text class="num" x="60" y="117">01</text>
  <text class="name" x="60" y="146">Frame</text>
  <text class="what" x="60" y="168">What do you want?</text>

  <rect class="node" x="330" y="90" width="240" height="88" rx="8"/>
  <text class="num" x="350" y="117">02</text>
  <text class="name" x="350" y="146">Diverge</text>
  <text class="what" x="350" y="168">What are your choices?</text>

  <rect class="node" x="620" y="90" width="240" height="88" rx="8"/>
  <text class="num" x="640" y="117">03</text>
  <text class="name" x="640" y="146">Tag</text>
  <text class="what" x="640" y="168">Fact, estimate, or preference?</text>

  <path class="arrow" d="M282 134 L318 134"/>
  <polygon class="arrow-head" points="328,134 317,128 317,140"/>
  <path class="arrow" d="M572 134 L608 134"/>
  <polygon class="arrow-head" points="618,134 607,128 607,140"/>
  <path class="drop" d="M450 178 L450 202 L40 202 L40 228"/>
  <polygon class="drop-head" points="40,238 33,226 47,226"/>

  <text class="phase" x="40" y="272">2 · Compare the choices</text>
  <text class="phase-sub" x="40" y="296">Focus on what matters and what may happen.</text>

  <rect class="node" x="40" y="318" width="240" height="88" rx="8"/>
  <text class="num" x="60" y="345">04</text>
  <text class="name" x="60" y="374">Weigh</text>
  <text class="what" x="60" y="396">What matters most?</text>

  <rect class="node" x="330" y="318" width="240" height="88" rx="8"/>
  <text class="num" x="350" y="345">05</text>
  <text class="name" x="350" y="374">Score</text>
  <text class="what" x="350" y="396">How does each choice compare?</text>

  <rect class="node" x="620" y="318" width="240" height="88" rx="8"/>
  <text class="num" x="640" y="345">06</text>
  <text class="name" x="640" y="374">Probabilify</text>
  <text class="what" x="640" y="396">How likely are key outcomes?</text>

  <path class="arrow" d="M282 362 L318 362"/>
  <polygon class="arrow-head" points="328,362 317,356 317,368"/>
  <path class="arrow" d="M572 362 L608 362"/>
  <polygon class="arrow-head" points="618,362 607,356 607,368"/>
  <path class="drop" d="M450 406 L450 430 L40 430 L40 456"/>
  <polygon class="drop-head" points="40,466 33,454 47,454"/>

  <text class="phase" x="40" y="500">3 · Check, decide, and learn</text>
  <text class="phase-sub" x="40" y="524">Test your choice, then review what happened.</text>

  <rect class="node-accent" x="40" y="546" width="240" height="56" rx="8"/>
  <text class="num-accent" x="60" y="570">07</text>
  <text class="name" x="100" y="583" style="font-size:19px">Stress</text>

  <rect class="node" x="330" y="546" width="240" height="56" rx="8"/>
  <text class="num" x="350" y="570">08</text>
  <text class="name" x="390" y="583" style="font-size:19px">Gate</text>

  <rect class="node" x="620" y="546" width="240" height="56" rx="8"/>
  <text class="num" x="640" y="570">09</text>
  <text class="name" x="680" y="583" style="font-size:19px">Commit</text>

  <path class="arrow" d="M282 574 L318 574"/>
  <polygon class="arrow-head" points="328,574 317,568 317,580"/>
  <path class="arrow" d="M572 574 L608 574"/>
  <polygon class="arrow-head" points="618,574 607,568 607,580"/>
</svg>