name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          # Node 26 is what the project is developed on. Pin the major so CI and
          # the local machine agree about which APIs exist.
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # tsc runs inside `pnpm build`, but running it separately means a type
      # error is reported as a type error rather than as a failed bundling step.
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
